<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Favorite Singers</title>
    <!-- Bootstrap 5 CSS CDN -->
    <link href="https://jsdelivr.net" rel="stylesheet">
    <link href="https://jsdelivr.net" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Navbar Element -->
    <nav class="navbar navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">🎵 Music Hub</span>
        </div>
    </nav>

    <!-- Main Container -->
    <div class="container">
        <div class="row g-4">
            
            <!-- Column 1: Image (.col-sm-4) -->
            <div class="col-sm-4 text-center">
                <div class="card shadow-sm p-3">
                    <img src="https://unsplash.com" 
                         class="img-fluid rounded shadow-sm" 
                         alt="Music Microphone">
                    <div class="card-body">
                        <h5 class="card-title mt-2">Legendary Voices</h5>
                        <p class="card-text text-muted small">A dynamically generated list of iconic musical artists.</p>
                    </div>
                </div>
            </div>

            <!-- Column 2: Table (.col-sm-8) -->
            <div class="col-sm-8">
                <div class="card shadow-sm p-4">
                    <h2 class="mb-4 text-primary text-sm-start text-center">Favorite Singers Portfolio</h2>
                    
                    <div class="table-responsive">
                        <table class="table table-striped table-hover align-middle">
                            <thead class="table-dark">
                                <tr>
                                    <th scope="col">Artist Name</th>
                                    <th scope="col">Hometown</th>
                                    <th scope="col">Best Song</th>
                                </tr>
                            </thead>
                            <tbody id="singers-table-body">
                                <!-- JavaScript will insert rows here dynamically -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>

        </div>
    </div>

    <!-- Bootstrap 5 Bundle JS CDN -->
    <script src="https://jsdelivr.net"></script>
    <!-- Custom JavaScript Link -->
    <script src="js/main.js"></script>
</body>
</html>
